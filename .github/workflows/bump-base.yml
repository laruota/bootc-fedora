name: bump-base

# Aggiorna il digest della base pinnata nel Containerfile.
#
# La base è pinnata per digest (tag@sha256:...) per avere build riproducibili e
# un aggiornamento della base revertibile con un `git revert`. Questo workflow
# tiene il pin fresco: risolve il digest upstream, riscrive l'hash nella riga
# FROM e, se è cambiato, committa su main. Il build giornaliero (03:17 UTC) usa
# poi il pin nuovo: nessun doppio build e nessuna build che si cancella a metà
# push. Se il repo richiede PR su main, questo job fallisce: in quel caso va
# tolto (o va reso un PR) e il bump resta manuale (`make base-digest`).
on:
  schedule:
    # 37 minuti prima del build giornaliero (03:17 UTC).
    - cron: '40 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-base
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream digest
        id: up
        run: |
          set -euo pipefail
          ref=$(scripts/base-ref.sh ref)
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y skopeo; }
          info=$(skopeo inspect --no-tags "docker://$ref")
          digest=$(printf '%s' "$info" | jq -r .Digest)
          version=$(printf '%s' "$info" | jq -r '.Labels["org.opencontainers.image.version"] // "unknown"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest inatteso: $digest" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream: $ref@$digest ($version)"

      - name: Update Containerfile
        id: upd
        env:
          REF: ${{ steps.up.outputs.ref }}
          DIGEST: ${{ steps.up.outputs.digest }}
        run: |
          set -euo pipefail
          current=$(scripts/base-ref.sh digest)
          echo "pinnato: $current"
          if [ "$current" = "$DIGEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -E "s|^FROM quay\.io/fedora/fedora-silverblue:[0-9]+@sha256:[0-9a-f]{64}.*$|FROM ${REF}@${DIGEST}|" Containerfile
          grep -n '^FROM quay.io/fedora/fedora-silverblue:' Containerfile
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.upd.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.up.outputs.version }}
          DIGEST: ${{ steps.up.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Containerfile
          git commit -m "chore(base): pin fedora-silverblue ${VERSION} (${DIGEST:7:12})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        env:
          REF: ${{ steps.up.outputs.ref }}
          DIGEST: ${{ steps.up.outputs.digest }}
          VERSION: ${{ steps.up.outputs.version }}
          CHANGED: ${{ steps.upd.outputs.changed }}
        run: |
          {
            echo "### bump-base"
            echo
            echo "- upstream: \`$REF@$DIGEST\` ($VERSION)"
            if [ "$CHANGED" = "true" ]; then
              echo "- esito: pin aggiornato e committato; lo raccoglie il build delle 03:17 UTC"
            else
              echo "- esito: pin già aggiornato, niente da fare"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
