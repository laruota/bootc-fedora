name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
      - 'scripts/push.sh'
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build (empty = ARG del Containerfile)'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bootc-fedora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck scripts
        run: make shellcheck

      # podman è già preinstallato sui runner ubuntu-latest.
      # Unica fonte della versione: ARG FEDORA_VERSION nel Containerfile.
      - name: Resolve Fedora version
        id: ver
        env:
          REQUESTED_FEDORA_VERSION: ${{ inputs.fedora_version }}
        run: |
          V="${REQUESTED_FEDORA_VERSION:-}"
          if [ -n "$V" ] && ! [[ "$V" =~ ^[0-9]+$ ]]; then
            echo "fedora_version deve essere un intero positivo" >&2
            exit 1
          fi
          [ -n "$V" ] || V="$(sed -n 's/^ARG FEDORA_VERSION=//p' Containerfile)"
          [[ "$V" =~ ^[0-9]+$ ]] || { echo "ARG FEDORA_VERSION non valido" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Cache distribuito Buildah: --cache-from/--cache-to accettano solo il
      # repository, MAI tag o digest (Buildah calcola i tag da sé dagli step).
      # Occorrono --layers e --cache-to, altrimenti --cache-from non popola/usa
      # nulla. Al primo giro il repo di cache è vuoto e la build prosegue.
      - name: Build image
        run: |
          podman build \
            --layers \
            --cache-from "$IMAGE" \
            --cache-to "$IMAGE" \
            --build-arg "FEDORA_VERSION=${{ steps.ver.outputs.version }}" \
            --build-arg "SOURCE_COMMIT=${{ github.sha }}" \
            --build-arg "VERSION=${{ steps.ver.outputs.version }}" \
            -t "$IMAGE:${{ steps.ver.outputs.version }}" \
            -t "$IMAGE:latest" .

      - name: Smoke test image
        run: make smoke IMAGE="$IMAGE" TAG="${{ steps.ver.outputs.version }}"

      - name: Push image
        run: |
          podman push "$IMAGE:${{ steps.ver.outputs.version }}"
          podman push "$IMAGE:latest"
