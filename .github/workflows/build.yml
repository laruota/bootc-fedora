name: build

# L'immagine viene rechunkata prima del push (scripts/rechunk.sh): layer
# content-based per pacchetto RPM, così `bootc upgrade` scarica solo il delta.
#
# Il push DEVE usare `--format oci`: il formato predefinito di podman perde le
# annotazioni `ostree.components`. Senza quelle annotazioni
# `build-chunked-oci --previous-build` considera l'immagine precedente "non
# chunked", ricalcola il piano dei layer da zero a ogni build e gli
# aggiornamenti tornano enormi (~1 GB/giorno invece di poche centinaia di MB).
#
# TODO (migliorie future — riferimento: ublue-os/image-template):
# - Enforcement lato target (`policy.json` sigstoreSigned + `bootc switch
#   --enforce-container-sigpolicy`): richiede una firma con chiave, che qui non
#   è configurata. La firma keyless c'è già.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
      - 'scripts/push.sh'
      - 'iso/**'
      - '.github/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
      - 'scripts/push.sh'
      - 'iso/**'
      - '.github/**'
  # Rebuild giornaliero. Serve perché `bootc upgrade` sulla target scarica
  # l'immagine puntata dal tag: senza una ricostruzione periodica, gli RPM
  # aggiornati nei repo (kernel a parte, che viene dalla base) non arrivano mai
  # (l'upgrade sarebbe un no-op). 03:17 UTC = fascia non di punta, minuto non
  # "tondo" per evitare i ritardi di GitHub sugli orari in punto. La base segue
  # il tag mobile `45`: ogni build prende base e RPM correnti.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Firma keyless (Sigstore) via OIDC di GitHub Actions: nessuna chiave da
  # custodire, e la firma è legata a questo repo/workflow.
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bootc-fedora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Il rechunk usa spazio in più (immagine intermedia + chunked): libera
      # i toolchain preinstallati che questa build non usa.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true

      # Serve a verificare (senza pull) se la build precedente è già chunked
      # prima di usarla come --previous-build. Se l'installazione fallisce il
      # build prosegue: rechunk.sh ignora semplicemente l'opzione.
      - name: Install skopeo
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq skopeo \
            || echo "::warning::skopeo non installato: --previous-build verrà ignorato"

      - name: ShellCheck scripts
        run: make shellcheck

      # Unica fonte di verità: la riga FROM del Containerfile, letta da
      # scripts/base-ref.sh (tag mobile della release).
      - name: Resolve version, date and base
        id: ver
        run: |
          set -euo pipefail
          version=$(scripts/base-ref.sh version)
          base=$(scripts/base-ref.sh ref)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Tracciabilità senza pin: il digest della base effettivamente usata
      # finisce nelle label OCI dell'immagine (podman image inspect).
      - name: Resolve base digest
        id: base
        run: |
          set -euo pipefail
          base='${{ steps.ver.outputs.base }}'
          podman pull -q "$base" >/dev/null
          digest=$(podman image inspect --format '{{.Digest}}' "$base")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest base inatteso: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "base: $base@$digest"

      # podman è già preinstallato sui runner ubuntu-latest.
      # La login viene scritta anche in ~/.docker/config.json perché cosign usa
      # quel file (non l'auth.json di podman).
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
            --authfile "$HOME/.docker/config.json"

      # Cache distribuito Buildah: --cache-from/--cache-to accettano solo il
      # repository, MAI tag o digest (Buildah calcola i tag da sé dagli step).
      # Occorrono --layers e --cache-to, altrimenti --cache-from non popola/usa
      # nulla. Al primo giro il repo di cache è vuoto e la build prosegue.
      # Su pull_request il token è in sola lettura: si salta la scrittura cache.
      # La cache vive nello stesso package dell'immagine (un package separato
      # richiederebbe permessi extra) e la ripulisce il workflow `retention`.
      #
      # --pull=newer: la base è un tag mobile, va risolta a ogni build.
      - name: Build image
        env:
          PUSH_CACHE: ${{ github.event_name != 'pull_request' }}
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
          SHA: ${{ steps.ver.outputs.sha }}
          BASE: ${{ steps.ver.outputs.base }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          cache_args=()
          if [ "$PUSH_CACHE" = "true" ]; then
            cache_args=(--cache-to "$IMAGE")
          fi
          podman build \
            --pull=newer \
            --layers \
            --cache-from "$IMAGE" \
            "${cache_args[@]}" \
            --label "org.opencontainers.image.base.name=$BASE" \
            --label "org.opencontainers.image.base.digest=$BASE_DIGEST" \
            --build-arg "VERSION=$VERSION" \
            --build-arg "SOURCE_COMMIT=${{ github.sha }}" \
            -t "$IMAGE:$VERSION-build" .

      # Rechunk: legge l'immagine montata come rootfs e riscrive i layer in
      # base ai pacchetti RPM. Da qui in poi `$VERSION` è l'immagine da
      # pubblicare; `$VERSION-build` è solo l'intermedia non chunked.
      #
      # PREVIOUS_BUILD ancora il piano dei layer alla build precedente. Sulla
      # prima build l'immagine precedente non è ancora chunked (manca la label
      # org.bootc-fedora.rechunked e/o le annotazioni ostree.components):
      # scripts/rechunk.sh la ignora.
      - name: Rechunk image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          PREVIOUS_BUILD="docker://$IMAGE:$VERSION" \
            scripts/rechunk.sh "$IMAGE" "$VERSION-build" "$VERSION"

      # Il digest è lo stesso per tutti i tag: si firma e si pubblica quello.
      - name: Tag rechunked image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          podman tag "$IMAGE:$VERSION" "$IMAGE:latest"
          podman tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-$DATE"
          podman tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-$SHA"

      - name: Smoke test image
        run: make smoke IMAGE="$IMAGE" TAG="${{ steps.ver.outputs.version }}"

      # Tag: `45` e `latest` sono i canali mutabili (quello che segue
      # `bootc upgrade`); `45-YYYYMMDD` e `45-<sha>` sono riferimenti comodi ma
      # non immutabili: il primo viene ripushato a ogni build del giorno, il
      # secondo a ogni rebuild dello stesso commit (il cron giornaliero). L'unico
      # identificatore stabile è il digest.
      # Il digest è lo stesso per tutti i tag: si firma e si pubblica quello.
      # `--format oci` è obbligatorio: preserva le annotazioni
      # `ostree.components` sui layer, che il push predefinito (v2s2) perde.
      # Senza, la build successiva non può riusare il piano dei layer.
      # Ordine dei push: prima i riferimenti per data/sha, poi i canali. Se un
      # push fallisce a metà, `45`/`latest` restano sulla build precedente (che è
      # quella buona) invece di puntare a un'immagine pubblicata solo in parte.
      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          podman push --format oci --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$VERSION-$DATE"
          podman push --format oci "$IMAGE:$VERSION-$SHA"
          podman push --format oci "$IMAGE:$VERSION"
          podman push --format oci "$IMAGE:latest"
          digest=$(cat "$RUNNER_TEMP/digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest inatteso: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Rete di sicurezza: se un giorno il push tornasse al formato predefinito
      # le annotazioni sparirebbero di nuovo e il piano dei layer ripartirebbe
      # da zero. Meglio fallire qui che scoprirlo da un upgrade da 1,8 GB.
      - name: Verify chunked layer annotations
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          skopeo inspect --raw "docker://$IMAGE@$DIGEST" > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1]))
          layers = manifest.get("layers", [])
          if len(layers) < 2:
              sys.exit(f"manifest inatteso: {len(layers)} layer")
          missing = [
              i
              for i, layer in enumerate(layers[1:], start=1)
              if "ostree.components" not in (layer.get("annotations") or {})
          ]
          if missing:
              sys.exit(
                  f"ostree.components mancante su {len(missing)} layer "
                  f"(primi indici: {missing[:5]}); il push deve usare --format oci"
              )
          print(f"ok: ostree.components su {len(layers) - 1} layer su {len(layers)}")
          PY

      - name: Install cosign
        if: github.event_name != 'pull_request'
        # Il repo non mantiene un tag mobile `v4`: va usata la versione esatta.
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Pinnato: la firma usa --new-bundle-format=false (formato legacy,
          # quello che sanno verificare anche cosign e containers/image), flag
          # deprecato che una futura major potrebbe rimuovere.
          cosign-release: 'v3.1.4'

      # Firma keyless: la identità è questo repository + questo workflow, e la
      # firma finisce nel log pubblico di Sigstore (nessuna chiave da gestire).
      # --new-bundle-format=false scrive la firma come tag OCI `sha256-<digest>.sig`
      # invece che come artifact del referrers API: è il formato che capiscono
      # anche `cosign verify` e containers/image (bootc). Su cosign v3 serve
      # anche --use-signing-config=false: con la signing config TUF il formato
      # legacy viene rifiutato se non si scrive anche un file bundle.
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --use-signing-config=false --new-bundle-format=false "$IMAGE@$DIGEST"

      - name: Verify signature
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
          SHA: ${{ steps.ver.outputs.sha }}
          BASE: ${{ steps.ver.outputs.base }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          layers=$(podman image inspect --format '{{len .RootFS.Layers}}' "$IMAGE:$VERSION")
          annotated=$(skopeo inspect --raw "docker://$IMAGE@$DIGEST" | python3 -c '
          import json
          import sys
          layers = json.load(sys.stdin).get("layers", [])
          print(sum(1 for layer in layers if "ostree.components" in (layer.get("annotations") or {})))
          ')
          {
            echo "### bootc-fedora $VERSION"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| immagine | \`$IMAGE@$DIGEST\` |"
            echo "| tag | \`$VERSION\`, \`latest\`, \`$VERSION-$DATE\`, \`$VERSION-$SHA\` |"
            echo "| base | \`$BASE@$BASE_DIGEST\` |"
            echo "| layer (rechunked) | \`$layers\` |"
            echo "| layer annotati (\`ostree.components\`) | \`$annotated/$layers\` |"
            echo
            echo "Pin sulla target: \`sudo bootc switch $IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
