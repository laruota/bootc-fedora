name: build

# TODO (migliorie future — riferimento: ublue-os/image-template):
# - Rechunk (`rpm-ostree experimental compose build-chunked-oci` / chunkah) per
#   update più piccoli e riprendibili sulla target.
# - Enforcement lato target (`policy.json` sigstoreSigned + `bootc switch
#   --enforce-container-sigpolicy`): richiede una firma con chiave, che qui non
#   è configurata. La firma keyless c'è già.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
      - 'scripts/push.sh'
      - 'iso/**'
      - '.github/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
      - 'scripts/push.sh'
      - 'iso/**'
      - '.github/**'
  # Rebuild giornaliero. Serve perché `bootc upgrade` sulla target scarica
  # l'immagine puntata dal tag: senza una ricostruzione periodica, gli RPM
  # aggiornati nei repo (kernel a parte, che viene dalla base) non arrivano mai
  # (l'upgrade sarebbe un no-op). 03:17 UTC = fascia non di punta, minuto non
  # "tondo" per evitare i ritardi di GitHub sugli orari in punto. La base è
  # pinnata per digest e viene aggiornata 37 minuti prima dal workflow
  # `bump-base`: questo build raccoglie il pin nuovo.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Firma keyless (Sigstore) via OIDC di GitHub Actions: nessuna chiave da
  # custodire, e la firma è legata a questo repo/workflow.
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bootc-fedora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck scripts
        run: make shellcheck

      # Unica fonte di verità: la riga FROM del Containerfile (tag + digest),
      # letta da scripts/base-ref.sh. Se non è pinnata per digest lo script
      # esce: meglio un errore chiaro che una build non riproducibile.
      - name: Resolve version, date and base
        id: ver
        run: |
          set -euo pipefail
          version=$(scripts/base-ref.sh version)
          base=$(scripts/base-ref.sh full)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # podman è già preinstallato sui runner ubuntu-latest.
      # La login viene scritta anche in ~/.docker/config.json perché cosign usa
      # quel file (non l'auth.json di podman).
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
            --authfile "$HOME/.docker/config.json"

      # Cache distribuito Buildah: --cache-from/--cache-to accettano solo il
      # repository, MAI tag o digest (Buildah calcola i tag da sé dagli step).
      # Occorrono --layers e --cache-to, altrimenti --cache-from non popola/usa
      # nulla. Al primo giro il repo di cache è vuoto e la build prosegue.
      # Su pull_request il token è in sola lettura: si salta la scrittura cache.
      # La cache vive nello stesso package dell'immagine (un package separato
      # richiederebbe permessi extra) e la ripulisce il workflow `retention`.
      #
      # Niente --pull=newer: la base è pinnata per digest, quindi il re-resolve
      # del tag non serve (e reintrodurrebbe non riproducibilità).
      - name: Build image
        env:
          PUSH_CACHE: ${{ github.event_name != 'pull_request' }}
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          cache_args=()
          if [ "$PUSH_CACHE" = "true" ]; then
            cache_args=(--cache-to "$IMAGE")
          fi
          podman build \
            --layers \
            --cache-from "$IMAGE" \
            "${cache_args[@]}" \
            --build-arg "VERSION=$VERSION" \
            --build-arg "SOURCE_COMMIT=${{ github.sha }}" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION-$DATE" \
            -t "$IMAGE:$VERSION-$SHA" .

      - name: Smoke test image
        run: make smoke IMAGE="$IMAGE" TAG="${{ steps.ver.outputs.version }}"

      # Tag: `45` e `latest` sono i canali mutabili (quello che segue
      # `bootc upgrade`); `45-YYYYMMDD` e `45-<sha>` sono riferimenti comodi ma
      # non immutabili: il primo viene ripushato a ogni build del giorno, il
      # secondo a ogni rebuild dello stesso commit (il cron giornaliero). L'unico
      # identificatore stabile è il digest.
      # Il digest è lo stesso per tutti i tag: si firma e si pubblica quello.
      # Ordine dei push: prima i riferimenti per data/sha, poi i canali. Se un
      # push fallisce
      # a metà, `45`/`latest` restano sulla build precedente (che è quella buona)
      # invece di puntare a un'immagine pubblicata solo in parte.
      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$VERSION-$DATE"
          podman push "$IMAGE:$VERSION-$SHA"
          podman push "$IMAGE:$VERSION"
          podman push "$IMAGE:latest"
          digest=$(cat "$RUNNER_TEMP/digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest inatteso: $digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4
        with:
          # Pinnato: la firma usa --new-bundle-format=false (formato legacy,
          # quello che sanno verificare anche cosign e containers/image), flag
          # deprecato che una futura major potrebbe rimuovere.
          cosign-release: 'v3.1.4'

      # Firma keyless: la identità è questo repository + questo workflow, e la
      # firma finisce nel log pubblico di Sigstore (nessuna chiave da gestire).
      # --new-bundle-format=false scrive la firma come tag OCI `sha256-<digest>.sig`
      # invece che come artifact del referrers API: è il formato che capiscono
      # anche `cosign verify` e containers/image (bootc). Su cosign v3 serve
      # anche --use-signing-config=false: con la signing config TUF il formato
      # legacy viene rifiutato se non si scrive anche un file bundle.
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --use-signing-config=false --new-bundle-format=false "$IMAGE@$DIGEST"

      - name: Verify signature
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
          SHA: ${{ steps.ver.outputs.sha }}
          BASE: ${{ steps.ver.outputs.base }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### bootc-fedora $VERSION"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| immagine | \`$IMAGE@$DIGEST\` |"
            echo "| tag | \`$VERSION\`, \`latest\`, \`$VERSION-$DATE\`, \`$VERSION-$SHA\` |"
            echo "| base | \`$BASE\` |"
            echo
            echo "Pin sulla target: \`sudo bootc switch $IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
