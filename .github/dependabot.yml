version: 2

# Aggiornamento delle GitHub Actions usate dai workflow. La base dell'immagine
# non è gestita qui: è il tag `45` nella riga FROM del Containerfile, aggiornato
# dal rebuild giornaliero dell'immagine.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
