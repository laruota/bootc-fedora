# NOTE: do NOT pass selinux=0 here. It disables SELinux in the installation
# environment AND in the installed system (Anaconda preserves the `selinux` arg
# and bootc force-disables the target: SELinuxFinalState::ForceTargetDisabled).
label: "bootc-fedora-Installer"
grub2:
  entries:
    - name: "Install bootc-fedora"
      linux: "/images/pxeboot/vmlinuz inst.stage2=hd:LABEL=bootc-fedora-Installer console=tty0 inst.graphical rhgb quiet"
      initrd: "/images/pxeboot/initrd.img"
